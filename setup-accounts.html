<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Setup test accounts</title>
<style>
body{font-family:Arial,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;color:#1a1a2e}
h1{color:#00195A;font-size:1.3rem}
button{background:#003087;color:#fff;border:0;padding:.8rem 1.2rem;border-radius:8px;font-size:1rem;cursor:pointer}
pre{background:#f4f7fd;border:1px solid #e3eaf7;padding:1rem;border-radius:8px;white-space:pre-wrap;font-size:.85rem}
.warn{background:#fff7ed;border:1px solid #fed7aa;padding:.8rem;border-radius:8px;font-size:.85rem;margin:1rem 0}
</style></head>
<body>
<h1>One-time setup: test customer records</h1>
<p>This writes the two test customers into the database the website uses, then reads them back.</p>
<p><b>Project:</b> <span id="proj">loading...</span></p>
<button id="go">Create test accounts</button>
<pre id="out">Press the button once.</pre>
<div class="warn">After it says <b>Done</b>, delete this page from GitHub. It should not stay online.</div>
<script type="module">
import { saveCustomer, listCustomers, PROJECT_ID } from './bank-db.js';
document.getElementById('proj').textContent = PROJECT_ID;

const RECORDS = {
  'BUS-10293847': {accNum:'BUS-10293847', name:'James Wilson', type:'High-Yield Savings (HYSA)', balance:'$12,450.00', sortCode:'026009593', email:'james.w@email.com', phone:'+1 212 555 0100', address:'New York, USA', joined:'January 2026', status:'Active'},
  'BUS-20384756': {accNum:'BUS-20384756', name:'Sarah Johnson', type:'Certificate of Deposit (CD)', balance:'$45,200.00', sortCode:'026009594', email:'sarah.j@email.com', phone:'+1 310 555 0200', address:'Los Angeles, USA', joined:'February 2026', status:'Active'}
};

document.getElementById('go').addEventListener('click', async () => {
  const out = document.getElementById('out');
  out.textContent = 'Writing records...';
  try{
    for (const acc of Object.keys(RECORDS)) {
      await saveCustomer(acc, RECORDS[acc]);
    }
    const found = await listCustomers();
    out.textContent = 'Project: ' + PROJECT_ID + '\nRecords the site can now read:\n' +
      found.map(c => '  ' + c.acc + '  ->  ' + c.name).join('\n') + '\n\nDone. Now sign in on the login page.';
  }catch(e){
    out.textContent = 'Error: ' + (e.code || '') + ' ' + (e.message || e);
  }
});
</script>
</body></html>
